name: HW24 v4.24 quality and article editor
on:
  push:
    branches:
      - feature/hw24-v424-clean-editor-and-filters-20261122
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run quality + editor contract tests
        run: node tests/hw24-v424.test.cjs
      - name: PHP syntax
        run: |
          php -l api/jtl-quality.php
          php -l api/hw24-quality-rules.php
          php -l api/curated.php
      - name: Browser scripts and form markup
        run: |
          node --check assets/hw24-quality-center.js
          node --check assets/hw24-article-editor.js
          python3 - <<'PY'
          import pathlib,re,subprocess
          for file in ('qualitaetszentrum.html','artikelpflege.html'):
            html=pathlib.Path(file).read_text('utf8')
            for src in re.findall(r'<script[^>]+src="(assets/[^"?]+)',html):
              assert pathlib.Path(src).exists(),(file,src)
            for code in re.findall(r'<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>',html,re.I):
              if code.strip():
                p=subprocess.run(['node','--check'],input=code,text=True,capture_output=True)
                assert p.returncode==0,(file,p.stderr)
          print('HTML assets and JS syntax: PASS')
          PY
