name: HW24 safe syntax checks
on:
  push:
    branches:
      - "feature/**"
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l api/amazon.php
          php -l api/amazon-pricing.php
          php -l api/curated.php
          php -l api/amazon-sellers.php
          php -l api/historie.php
      - name: JavaScript syntax
        run: |
          node --check assets/amazon-catalog.js
          node --check assets/amazon-market.js
          node --check assets/hw24-curated.js
          for file in assets/*.js; do node --check "$file"; done
      - name: Embedded JavaScript and asset manifest
        run: |
          python3 - <<'PY'
          import re, subprocess, pathlib, sys
          html=pathlib.Path('index.html').read_text(encoding='utf-8')
          errors=0
          for i, script in enumerate(re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I),1):
              if not script.strip():continue
              p=subprocess.run(['node','--check'],input=script,text=True,capture_output=True)
              if p.returncode:
                  print('Inline script',i,'failed:\n',p.stderr)
                  errors+=1
          files=set(re.findall(r'(?:src|href)=[\x22\x27](assets/[^\x22\x27?]+)',html))
          missing=sorted(str(x) for x in files if not pathlib.Path(x).is_file())
          if missing:
              print('Deployment BLOCKED: files referenced in HTML but missing in repository:')
              print('\n'.join(missing))
              errors+=1
          if errors:sys.exit(1)
          print('OK: inline JS valid and referenced assets present.')
          PY

  package:
    name: Create deployable website artifact
    needs: syntax
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build safe site-only package
        run: |
          set -euo pipefail
          mkdir -p build/site build
          cp index.html build/site/index.html
          cp -R assets api build/site/
          printf 'GitHub SHA: %s\nBranch or ref: %s\n' "$GITHUB_SHA" "$GITHUB_REF" > build/site/RELEASE.txt
          # Deliberately exclude: .git, .github, sql, docs, sync, hw24_private.
          test ! -e build/site/hw24_private
          test ! -e build/site/sql
          test ! -e build/site/sync
          cd build/site
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          zip -q -r ../hw24-website.zip .
      - name: Upload safe website package
        uses: actions/upload-artifact@v4
        with:
          name: hw24-website-${{ github.sha }}
          path: build/hw24-website.zip
          if-no-files-found: error
          retention-days: 30

  publish_staging:
    name: Publish reviewed website files to Plesk staging branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/hw24-v422-amazon-market-20261119'
    needs: [syntax, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish ONLY index.html, assets and api to deploy/staging
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          CURRENT="$(gh api "repos/$REPO/git/ref/heads/deploy/staging" --jq '.object.sha')"
          INDEX="$(git rev-parse HEAD:index.html)"
          ASSETS="$(git rev-parse HEAD:assets)"
          API="$(git rev-parse HEAD:api)"
          TREE="$(jq -n --arg index "$INDEX" --arg assets "$ASSETS" --arg api "$API" \
            '{tree:[{path:"index.html",mode:"100644",type:"blob",sha:$index},{path:"assets",mode:"040000",type:"tree",sha:$assets},{path:"api",mode:"040000",type:"tree",sha:$api}]}' \
            | gh api -X POST "repos/$REPO/git/trees" --input - --jq '.sha')"
          PREVIOUS_TREE="$(gh api "repos/$REPO/git/commits/$CURRENT" --jq '.tree.sha')"
          if [[ "$TREE" = "$PREVIOUS_TREE" ]]; then
            echo 'Website files unchanged; deployment branch already current.'
            exit 0
          fi
          NEXT="$(jq -n --arg parent "$CURRENT" --arg tree "$TREE" --arg source "$GITHUB_SHA" \
            '{message:("Staging website from verified source "+$source),tree:$tree,parents:[$parent]}' \
            | gh api -X POST "repos/$REPO/git/commits" --input - --jq '.sha')"
          jq -n --arg sha "$NEXT" '{sha:$sha,force:false}' \
            | gh api -X PATCH "repos/$REPO/git/refs/heads/deploy/staging" --input - >/dev/null
          echo "Published safe website tree $TREE as deploy/staging commit $NEXT"
          echo 'Plesk must track deploy/staging. No SQL, docs, .github or sync directories are published.'
